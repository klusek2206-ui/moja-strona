<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web server is down | http://www.sp.bychawa.pl/</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
        }

        .header-container {
            max-width: 1000px;
            margin: 40px auto 30px auto;
            padding: 0 20px;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 64px;
            font-weight: 300;
            margin: 0;
            color: #333333;
        }

        .error-badge {
            background-color: #e0e0e0;
            color: #555555;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 500;
            margin-top: 15px;
        }

        .meta-info {
            font-size: 16px;
            color: #666666;
            margin-top: 15px;
            line-height: 1.6;
        }

        .meta-info a {
            color: #0051c3;
            text-decoration: none;
        }

        .meta-info a:hover {
            text-decoration: underline;
        }

        /* Główny szary panel z diagramem */
        .diagram-section {
            background-color: #eaeaea;
            padding: 60px 20px 40px 20px;
            border-bottom: 1px solid #dcdcdc;
            position: relative;
        }

        .diagram-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .node {
            text-align: center;
            flex: 1;
            position: relative;
        }

        /* Kontenery na ikony Cloudflare */
        .icon-wrapper {
            position: relative;
            display: inline-block;
            width: 120px;
            height: 90px;
            margin-bottom: 15px;
        }

        .main-icon {
            width: 100%;
            height: 100%;
            fill: #9a9a9a;
        }

        /* Małe statusy (kółka z ptaszkiem/krzyżykiem) nałożone na ikony */
        .status-badge {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-55%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #eaeaea;
        }

        .status-badge.success {
            background-color: #74c027;
        }

        .status-badge.danger {
            background-color: #b92525;
        }

        .status-badge svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* Teksty w diagramie */
        .node-name {
            font-size: 15px;
            color: #666666;
            margin-bottom: 8px;
        }

        .node-type {
            font-size: 22px;
            color: #999999;
            margin-bottom: 4px;
        }

        .node-status {
            font-size: 24px;
            font-weight: 400;
        }

        .node-status.working {
            color: #74c027;
        }

        .node-status.error {
            color: #b92525;
        }

        .node-type.cf-active {
            color: #0051c3;
        }

        /* Mały biały dzióbek na samym dole szarej sekcji */
        .arrow-down {
            position: absolute;
            bottom: 0;
            left: 83.5%; /* Wskazuje na serwer */
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 12px solid #ffffff;
        }
    </style>
</head>
<body>

    <!-- GÓRNY NAGŁÓWEK -->
    <div class="header-container">
        <div class="title-row">
            <h1>Web server is down</h1>
            <div class="error-badge">Error code 521</div>
        </div>
        <div class="meta-info">
            Visit <a href="https://cloudflare.com">cloudflare.com</a> for more information.<br>
            2026-05-29 19:57:12 UTC
        </div>
    </div>

    <!-- SEKCJA Z DIAGRAMEM (SZARE TŁO) -->
    <div class="diagram-section">
        <div class="diagram-container">
            
            <!-- Przeglądarka (You) -->
            <div class="node">
                <div class="icon-wrapper">
                    <!-- Ikona przeglądarki/okna -->
                    <svg class="main-icon" viewBox="0 0 24 24">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 4h16V6H4v2z"/>
                    </svg>
                    <div class="status-badge success">
                        <!-- Ptaszek -->
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </div>
                </div>
                <div class="node-name">You</div>
                <div class="node-type">Browser</div>
                <div class="node-status working">Working</div>
            </div>

            <!-- Serwer Cloudflare (San Jose / Warszawa) -->
            <div class="node">
                <div class="icon-wrapper">
                    <!-- Ikona chmury -->
                    <svg class="main-icon" viewBox="0 0 24 24">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                    </svg>
                    <div class="status-badge success">
                        <!-- Ptaszek -->
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.41 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </div>
                </div>
                <div class="node-name">Warsaw</div>
                <div class="node-type cf-active">Cloudflare</div>
                <div class="node-status working">Working</div>
            </div>

            <!-- Serwer docelowy (Błąd) -->
            <div class="node">
                <div class="icon-wrapper">
                    <!-- Ikona serwera fizycznego -->
                    <svg class="main-icon" viewBox="0 0 24 24">
                        <path d="M19 13H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm-3 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm3 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-7H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm-3 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm3 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z" transform="translate(0, -4)"/>
                    </svg>
                    <div class="status-badge danger">
                        <!-- Krzyżyk X -->
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </div>
                </div>
                <div class="node-name">http://www.sp.bychawa.pl/</div>
                <div class="node-type">Host</div>
                <div class="node-status error">Error</div>
            </div>

        </div>
        <!-- Biały trójkącik na dole sekcji -->
        <div class="arrow-down"></div>
    </div>

</body>
</html>
