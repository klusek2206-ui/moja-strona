<!DOCTYPE html>
<html>
<head>
  <title>Dark Fashion</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    img {
      width: 300px;
      margin: 10px;
    }
    #map {
      height: 400px;
      margin-top: 20px;
    }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

<h1>Dark Streetwear</h1>
<p>Inspired by Vetements style</p>

<img src="https://images.garmentory.com/images/10494437/xl/VETEMENTS-Black-oversize-hoodie-20240110143830.jpg?1704897514">
<img src="https://photo.yupoo.com/vetementsshop/cae6e64e/5bb003e0.jpg">

<h2>Visitors Map 🌍</h2>
<div id="map"></div>

<p id="visits"></p>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  fetch("https://ipapi.co/json/")
    .then(res => res.json())
    .then(data => {
      const lat = data.latitude;
      const lon = data.longitude;

      L.marker([lat, lon])
        .addTo(map)
        .bindPopup("You are here")
        .openPopup();
    });

  fetch("https://api.countapi.xyz/hit/mojastrona/visits")
    .then(res => res.json())
    .then(data => {
      document.getElementById("visits").innerText =
        "Visits: " + data.value;
    });
</script>

</body>
</html>
